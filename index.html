<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Terrenos - Tecámac</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 8px 0; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .online { background: #e6f4ea; color: #137333; }
    .offline { background: #fce8e6; color: #c5221f; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:disabled { background: #9aa0a6; }
    .btn-export { background: #188038; color: white; }
    .btn-clear { background: #fff; color: #c5221f; border: 1px solid #c5221f; font-size: 0.85rem; padding: 10px; }
    #gps-info {
      font-size: 0.9rem;
      color: #444;
      background: #f1f3f4;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.9rem;
    }
    .item:last-child { border-bottom: none; }
    .coords { font-family: monospace; color: #1a73e8; font-weight: bold; }
    .meta { font-size: 0.8rem; color: #666; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Levantamiento de Terrenos</h1>
    <div id="net-status" class="status-bar online">Verificando conexión...</div>

    <label for="lote">Identificador / Lote del Terreno:</label>
    <input type="text" id="lote" placeholder="Ej. Lote 14 - Manzana 3">

    <div id="gps-info">Presiona el botón para capturar el punto GPS exacto.</div>

    <button id="btn-capturar" class="btn-primary" onclick="tomarCoordenada()">
      📍 Tomar y Guardar Coordenada
    </button>
  </div>

  <div class="card">
    <h1>Terrenos Guardados (<span id="contador">0</span>)</h1>
    <button class="btn-export" onclick="exportarCSV()">📥 Descargar en Excel (CSV)</button>
    <div id="lista-puntos"></div>
    <br>
    <button class="btn-clear" onclick="borrarTodo()">🗑️ Limpiar historial</button>
  </div>

  <script>
    let puntos = JSON.parse(localStorage.getItem('terrenos_tecamac')) || [];

    // 1. Detectar si hay internet o estamos en modo offline (campo sin señal)
    function actualizarEstadoRed() {
      const badge = document.getElementById('net-status');
      if (navigator.onLine) {
        badge.className = 'status-bar online';
        badge.textContent = '🟢 Con conexión (GPS + Red)';
      } else {
        badge.className = 'status-bar offline';
        badge.textContent = '🟠 Sin internet (Modo Satélite Offline activo)';
      }
    }
    window.addEventListener('online', actualizarEstadoRed);
    window.addEventListener('offline', actualizarEstadoRed);
    actualizarEstadoRed();

    // 2. Función principal: Toma la coordenada usando el chip GPS físico
    function tomarCoordenada() {
      const loteInput = document.getElementById('lote');
      const nombreLote = loteInput.value.trim() || `Terreno #${puntos.length + 1}`;
      const infoBox = document.getElementById('gps-info');
      const btn = document.getElementById('btn-capturar');

      if (!("geolocation" in navigator)) {
        infoBox.textContent = "❌ Tu navegador no soporta geolocalización.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "⏳ Buscando satélites GPS...";
      infoBox.textContent = "Mantente quieto en el terreno. Esto puede tardar unos segundos sin internet...";

      // Opciones clave para funcionar sin internet
      const opcionesGPS = {
        enableHighAccuracy: true, // Obliga al teléfono a usar el chip GPS satelital
        timeout: 30000,           // Espera hasta 30 segundos (necesario en zonas sin señal)
        maximumAge: 0             // No usa ubicaciones viejas en caché; toma la actual
      };

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const nuevoPunto = {
            id: Date.now(),
            lote: nombreLote,
            lat: pos.coords.latitude.toFixed(7),
            lng: pos.coords.longitude.toFixed(7),
            precision: Math.round(pos.coords.accuracy),
            modo: navigator.onLine ? "Con Red" : "Offline (Satélite)",
            fecha: new Date().toLocaleString('es-MX')
          };

          puntos.unshift(nuevoPunto);
          localStorage.setItem('terrenos_tecamac', JSON.stringify(puntos));

          infoBox.innerHTML = `✅ <b>Guardado:</b> ${nuevoPunto.lote}<br>
                               Lat: ${nuevoPunto.lat}, Lng: ${nuevoPunto.lng}<br>
                               Precisión: ±${nuevoPunto.precision} metros`;
          
          loteInput.value = "";
          btn.disabled = false;
          btn.textContent = "📍 Tomar y Guardar Coordenada";
          renderizarLista();
        },
        (err) => {
          let mensaje = "Error al obtener GPS.";
          if (err.code === 1) mensaje = "❌ Permiso denegado. Activa la ubicación en los ajustes del navegador.";
          if (err.code === 2) mensaje = "❌ Señal satelital no disponible. Aléjate de techos o árboles densos.";
          if (err.code === 3) mensaje = "⏳ Tiempo agotado. Intenta de nuevo bajo cielo despejado.";
          
          infoBox.textContent = mensaje;
          btn.disabled = false;
          btn.textContent = "📍 Reintentar Coordenada";
        },
        opcionesGPS
      );
    }

    // 3. Mostrar lista en pantalla
    function renderizarLista() {
      const contenedor = document.getElementById('lista-puntos');
      document.getElementById('contador').textContent = puntos.length;
      
      if (puntos.length === 0) {
        contenedor.innerHTML = '<p style="color:#777; font-size:0.9rem;">Aún no hay terrenos registrados.</p>';
        return;
      }

      contenedor.innerHTML = puntos.map(p => `
        <div class="item">
          <strong>${p.lote}</strong><br>
          <span class="coords">${p.lat}, ${p.lng}</span><br>
          <span class="meta">Error: ±${p.precision}m | ${p.modo} | ${p.fecha}</span>
        </div>
      `).join('');
    }

    // 4. Exportar a CSV (Excel) para cuando regreses de campo
    function exportarCSV() {
      if (puntos.length === 0) return alert("No hay datos para exportar.");
      let csv = "Lote,Latitud,Longitud,Precision_Metros,Modo,Fecha\n";
      puntos.forEach(p => {
        csv += `"${p.lote}",${p.lat},${p.lng},${p.precision},"${p.modo}","${p.fecha}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `terrenos_tecamac_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function borrarTodo() {
      if (confirm("¿Seguro que quieres borrar todos los puntos guardados?")) {
        puntos = [];
        localStorage.removeItem('terrenos_tecamac');
        renderizarLista();
      }
    }

    renderizarLista();
  </script>
</body>
</html>
